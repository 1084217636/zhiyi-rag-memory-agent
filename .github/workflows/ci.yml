name: ci

on:
  push: {}
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zhiyi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Check Python source
        run: uv run ruff check app eval tests
      - name: Run unit and policy tests
        run: uv run pytest -q tests
      - name: Check eval scorer against labeled demonstration cases
        run: uv run python -m eval.grounded_metrics eval/fixtures/agent_eval_demo.jsonl --min-cases 6

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  packaging:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: zhiyi-${{ matrix.service }}:${{ github.sha }}

  compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose without real secrets
        run: |
          cp .env.example .env
          docker compose config --quiet

  deliver-images:
    # A deliberate manual promotion to GHCR; deployment to a real cluster is
    # not configured in this repository.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, packaging, compose-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish reviewed SHA image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ github.repository }}/zhiyi-${{ matrix.service }}:${{ github.sha }}
